<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tienda">
        <section class="catalogo">
            <h3>Catalogo</h3>
            <div class="listproductos" id="listaproductos"></div>
        </section>

        <aside class="carrito">
            <h3>Carrito de compras</h3>
            <div class="itemscarrito" id="itemscarrito"></div>
            <p class="totalcarrito">Total: <span id="totalcarrito">$ 0</span></p>
            <button class="btnvaciarcarritto">Vaciar carrito</button>
            <button class="btncheckout">Finalizar compra</button>
            <p class="mensajecheckout" id="mensajecheckout"></p>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
